<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Email</ion-label>
    <ion-input type="email" [(ngModel)]="email" name="email"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Contrasena</ion-label>
    <ion-input type="password" [(ngModel)]="password" name="password"></ion-input>
  </ion-item>

  <ion-button
    expand="block"
    class="ion-margin-top"
    [disabled]="enviando()"
    (click)="iniciarSesion()"
  >
    Iniciar sesion
  </ion-button>

  <ion-button expand="block" fill="clear" routerLink="/registro">Registrarse</ion-button>
</ion-content>
