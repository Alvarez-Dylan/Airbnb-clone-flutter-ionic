<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - bnb Anfitriones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#0B6E4F',
              hover: '#095940',
              light: '#E8F3EE',
              surface: '#F6F2EA'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="h-full bg-[#F6F2EA] text-[#1D2622] font-sans antialiased flex flex-col justify-between p-6 sm:p-8">

  <!-- Barra de estado superior simulada o espaciador seguro -->
  <div class="w-full flex items-center justify-between text-xs font-semibold text-[#66706B] pt-1 pb-4">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-[16px]">wifi</span>
      <span class="material-symbols-outlined text-[16px]">battery_full</span>
    </div>
  </div>

  <!-- Contenedor central -->
  <main class="w-full max-w-sm mx-auto flex-1 flex flex-col justify-center py-4">

    <!-- Encabezado centrado -->
    <header class="text-center mb-8">
      <!-- Círculo de marca con icono de casa -->
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-[#0B6E4F] text-white shadow-lg shadow-[#0B6E4F]/25 mb-4 ring-8 ring-[#0B6E4F]/10">
        <span class="material-symbols-outlined fill text-4xl">home</span>
      </div>

      <!-- Nombre de app -->
      <h1 class="text-4xl font-extrabold tracking-tight text-[#1D2622] leading-none mb-1.5">
        bnb
      </h1>

      <!-- Subtítulo -->
      <p class="text-base font-semibold text-[#0B6E4F] tracking-wide uppercase text-xs bg-[#0B6E4F]/10 py-1 px-3 rounded-full inline-block mt-1">
        Para anfitriones
      </p>
    </header>

    <!-- Tarjeta del formulario -->
    <div class="bg-white rounded-3xl p-6 sm:p-7 shadow-[0_12px_32px_rgba(29,38,34,0.06)] border border-[#E5E0D5]">
      <form class="space-y-4" onsubmit="event.preventDefault();">

        <!-- Campo Email con etiqueta flotante moderna -->
        <div class="relative">
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder=" "
            class="peer w-full h-14 px-4 pt-4 pb-1 text-base text-[#1D2622] bg-white rounded-2xl border border-[#D5CFC3] focus:border-[#0B6E4F] focus:ring-2 focus:ring-[#0B6E4F]/20 focus:outline-none transition-all duration-200 placeholder-transparent"
          />
          <label 
            for="email" 
            class="absolute left-4 top-1.5 text-xs font-semibold text-[#66706B] transition-all duration-200 peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-placeholder-shown:font-normal peer-placeholder-shown:text-[#88908B] peer-focus:top-1.5 peer-focus:text-xs peer-focus:font-semibold peer-focus:text-[#0B6E4F] pointer-events-none"
          >
            Email
          </label>
          <div class="absolute right-4 top-4 text-[#88908B] peer-focus:text-[#0B6E4F] pointer-events-none">
            <span class="material-symbols-outlined text-xl">mail</span>
          </div>
        </div>

        <!-- Campo Contraseña con etiqueta flotante y botón de mostrar/ocultar -->
        <div class="relative">
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder=" "
            class="peer w-full h-14 pl-4 pr-12 pt-4 pb-1 text-base text-[#1D2622] bg-white rounded-2xl border border-[#D5CFC3] focus:border-[#0B6E4F] focus:ring-2 focus:ring-[#0B6E4F]/20 focus:outline-none transition-all duration-200 placeholder-transparent"
          />
          <label 
            for="password" 
            class="absolute left-4 top-1.5 text-xs font-semibold text-[#66706B] transition-all duration-200 peer-placeholder-shown:top-4 peer-placeholder-shown:text-base peer-placeholder-shown:font-normal peer-placeholder-shown:text-[#88908B] peer-focus:top-1.5 peer-focus:text-xs peer-focus:font-semibold peer-focus:text-[#0B6E4F] pointer-events-none"
          >
            Contraseña
          </label>
          <button 
            type="button" 
            id="togglePassword"
            aria-label="Mostrar u ocultar contraseña"
            class="absolute right-3.5 top-3.5 p-1 text-[#88908B] hover:text-[#1D2622] focus:outline-none focus:text-[#0B6E4F] transition-colors rounded-lg"
          >
            <span id="eyeIcon" class="material-symbols-outlined text-xl">visibility</span>
          </button>
        </div>

        <!-- Enlace Olvidé mi contraseña -->
        <div class="flex justify-end pt-1">
          <a href="#" class="text-xs font-semibold text-[#0B6E4F] hover:underline focus:outline-none">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Botón principal ancho relleno en verde -->
        <button 
          type="submit" 
          class="w-full h-13 py-3.5 px-6 rounded-2xl bg-[#0B6E4F] hover:bg-[#095940] active:scale-[0.98] text-white font-bold text-base shadow-md shadow-[#0B6E4F]/25 transition-all duration-150 flex items-center justify-center gap-2 mt-2"
        >
          <span>Iniciar sesión</span>
          <span class="material-symbols-outlined text-xl">arrow_forward</span>
        </button>

        <!-- Botón de texto Registrarse -->
        <div class="pt-2 text-center">
          <button 
            type="button" 
            class="w-full py-2.5 px-4 text-sm font-bold text-[#0B6E4F] hover:bg-[#0B6E4F]/5 active:scale-[0.98] rounded-2xl transition-all duration-150 focus:outline-none"
          >
            Registrarse
          </button>
        </div>
      </form>
    </div>

    <!-- Divisor o ayuda contextual -->
    <div class="text-center mt-6">
      <p class="text-xs text-[#7A837E]">
        ¿Necesitas ayuda con tu cuenta de anfitrión? 
        <a href="#" class="font-semibold text-[#0B6E4F] hover:underline">Soporte</a>
      </p>
    </div>

  </main>

  <!-- Footer con aviso legal -->
  <footer class="w-full text-center text-[11px] text-[#9AA19D] py-2">
    Protegido por reCAPTCHA · <a href="#" class="hover:underline">Privacidad</a> · <a href="#" class="hover:underline">Términos</a>
  </footer>

  <!-- Script interactivo para el toggle de contraseña -->
  <script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleButton && passwordInput && eyeIcon) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</body>
</html>
